<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROM基本軸・移動軸 〇×クイズ</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f9f9f9; color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .hidden { display: none; }
    img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid #ccc; margin: 10px 0; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: #fff; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.btn-ox { width: 100px; font-size: 24px; font-weight: bold; }
    button.btn-o { background: #28a745; } button.btn-x { background: #dc3545; }
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
    .nav { margin-bottom: 15px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    .nav button { background: #6c757d; }
    .mode-btn { width: 100%; margin: 6px 0; padding: 12px; font-size: 16px; text-align: left; box-sizing: border-box; }
    #loading { font-size: 18px; font-weight: bold; color: #007bff; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <div class="nav">
    <button onclick="showScreen('mode-screen')">モード選択</button>
    <button onclick="showScreen('admin-screen')">問題を編集する</button>
  </div>

  <div id="loading">問題データを読み込み中...</div>

  <!-- モード選択画面 -->
  <div id="mode-screen" class="card hidden">
    <h2>演習モードを選択</h2>
    <button class="mode-btn" style="background:#dc3545;" onclick="startQuiz('all', true)">ランダム全問演習</button>
    <hr style="margin: 15px 0;">
    <h3>部位別演習</h3>
    <div id="category-buttons"></div>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz-screen" class="card hidden">
    <h2 id="q-title">問題</h2>
    <div id="q-image-container"></div>
    <p id="q-text" style="font-size: 18px; font-weight: bold;"></p>
    
    <div id="quiz-actions">
      <button class="btn-ox btn-o" onclick="checkAnswer(true)">〇</button>
      <button class="btn-ox btn-x" onclick="checkAnswer(false)">×</button>
    </div>

    <div id="result-area" class="hidden" style="margin-top: 15px;">
      <h3 id="result-text"></h3>
      <p id="explanation-text"></p>
      <button onclick="nextQuestion()">次の問題へ</button>
    </div>
  </div>

  <!-- 問題編集画面 -->
  <div id="admin-screen" class="card hidden">
    <h2>問題管理</h2>
    <h3>新規問題追加（スプレッドシートに即時保存）</h3>
    <form id="add-form">
      <label>部位</label>
      <select id="input-category">
        <option value="頭頚部">頭頚部</option>
        <option value="体幹">体幹</option>
        <option value="肩甲帯">肩甲帯</option>
        <option value="肩関節">肩関節</option>
        <option value="肘関節">肘関節</option>
        <option value="手関節">手関節</option>
        <option value="手指">手指</option>
        <option value="股関節">股関節</option>
        <option value="膝関節">膝関節</option>
        <option value="足関節">足関節</option>
        <option value="足部・足趾">足部・足趾</option>
      </select>

      <label>関節・運動名（例：肩関節 屈曲）</label>
      <input type="text" id="input-joint" placeholder="肩関節 屈曲">

      <label>問題文</label>
      <textarea id="input-text" rows="2" placeholder="基本軸は肩甲骨外側縁である。"></textarea>

      <label>画像URL（Googleドライブの共有リンクまたは画像直URL / 空欄可）</label>
      <input type="text" id="input-img" placeholder="https://...">

      <label>正解</label>
      <select id="input-answer">
        <option value="true">〇（正しい）</option>
        <option value="false">×（誤り）</option>
      </select>

      <label>解説</label>
      <textarea id="input-exp" rows="2" placeholder="正解は「肩甲骨腋窩縁」です。"></textarea>

      <button type="button" id="submit-btn" onclick="handleAddQuestion()" style="background:#28a745;">追加する</button>
    </form>
  </div>

  <script>
    // ★ここにStep 1で取得したGoogle Apps ScriptのURLを貼り付けます
    const GAS_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    const CATEGORIES = [
      { name: "頭頚部", color: "#007bff" }, { name: "体幹", color: "#007bff" },
      { name: "肩甲帯", color: "#ffc107" }, { name: "肩関節", color: "#ffc107" },
      { name: "肘関節", color: "#ffc107" }, { name: "手関節", color: "#ffc107" },
      { name: "手指", color: "#ffc107" }, { name: "股関節", color: "#28a745" },
      { name: "膝関節", color: "#28a745" }, { name: "足関節", color: "#28a745" },
      { name: "足部・足趾", color: "#28a745" }
    ];

    let questions = [];
    let activePlaylist = [];
    let currentIndex = 0;

    async function fetchQuestions() {
      try {
        const res = await fetch(GAS_URL);
        questions = await res.json();
        document.getElementById('loading').classList.add('hidden');
        showScreen('mode-screen');
      } catch (err) {
        alert("データの読み込みに失敗しました。URLを確認してください。");
      }
    }

    function showScreen(screenId) {
      document.getElementById('mode-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('admin-screen').classList.add('hidden');
      document.getElementById(screenId).classList.remove('hidden');
      
      if (screenId === 'mode-screen') renderCategoryButtons();
    }

    function renderCategoryButtons() {
      const container = document.getElementById('category-buttons');
      container.innerHTML = CATEGORIES.map(cat => 
        `<button class="mode-btn" style="background:${cat.color}; color:#fff;" onclick="startQuiz('${cat.name}', false)">${cat.name} 演習</button>`
      ).join('');
    }

    function startQuiz(category, isRandom) {
      activePlaylist = category === 'all' ? [...questions] : questions.filter(q => q.category === category);

      if (activePlaylist.length === 0) {
        alert("該当する問題がありません。");
        return;
      }

      if (isRandom) activePlaylist.sort(() => Math.random() - 0.5);

      currentIndex = 0;
      showScreen('quiz-screen');
      loadQuestion();
    }

    function loadQuestion() {
      const q = activePlaylist[currentIndex];
      document.getElementById('q-title').innerText = `【${q.joint || q.category}】（${currentIndex + 1}/${activePlaylist.length}）`;
      document.getElementById('q-text').innerText = q.text;
      
      const imgContainer = document.getElementById('q-image-container');
      imgContainer.innerHTML = q.img ? `<img src="${formatImageUrl(q.img)}" alt="問題画像">` : '';
      
      document.getElementById('result-area').classList.add('hidden');
      document.getElementById('quiz-actions').classList.remove('hidden');
    }

    // Googleドライブの共有リンクを画像表示用URLに変換するヘルパー
    function formatImageUrl(url) {
      if (url.includes('drive.google.com') && url.includes('/d/')) {
        const id = url.split('/d/')[1].split('/')[0];
        return `https://drive.google.com/uc?export=view&id=${id}`;
      }
      return url;
    }

    function checkAnswer(userAnswer) {
      const q = activePlaylist[currentIndex];
      const isCorrect = userAnswer === q.answer;
      
      document.getElementById('result-text').innerText = isCorrect ? "正解！" : "不正解…";
      document.getElementById('result-text').style.color = isCorrect ? "#28a745" : "#dc3545";
      document.getElementById('explanation-text').innerText = q.exp;
      
      document.getElementById('quiz-actions').classList.add('hidden');
      document.getElementById('result-area').classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < activePlaylist.length) {
        loadQuestion();
      } else {
        alert("全問題が終了しました！");
        showScreen('mode-screen');
      }
    }

    async function handleAddQuestion() {
      const btn = document.getElementById('submit-btn');
      const jointVal = document.getElementById('input-joint').value.trim();
      const textVal = document.getElementById('input-text').value.trim();
      const expVal = document.getElementById('input-exp').value.trim();

      if (!jointVal || !textVal || !expVal) {
        alert("必須項目を入力してください。");
        return;
      }

      btn.disabled = true;
      btn.innerText = "送信中...";

      const newQ = {
        category: document.getElementById('input-category').value,
        joint: jointVal,
        text: textVal,
        img: document.getElementById('input-img').value.trim(),
        answer: document.getElementById('input-answer').value === "true",
        exp: expVal
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(newQ)
        });
        alert("スプレッドシートに問題を追加しました！");
        document.getElementById('add-form').reset();
        await fetchQuestions(); // 最新データを再取得
      } catch (err) {
        alert("追加に失敗しました。");
      } finally {
        btn.disabled = false;
        btn.innerText = "追加する";
      }
    }

    // 初回読み込み
    fetchQuestions();
  </script>
</body>
</html>
